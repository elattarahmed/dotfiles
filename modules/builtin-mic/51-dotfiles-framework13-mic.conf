## Framework Laptop 13 (AMD Ryzen AI 300): the real built-in microphone
## (from the dotfiles repo, item builtin-mic).
##
## The firmware advertises an AMD audio coprocessor that no microphone is
## wired to: its card (acp-pdm-mach) only gives a flat, stuck signal, and the
## Realtek ALC285's UCM profile labels that path "Digital Microphone" and
## makes the empty headset jack the default input. With UCM off for the
## ALC285 card, WirePlumber uses the generic analog profile, whose input is
## the working internal stereo microphone (the one the privacy switch cuts).
## Keep its volume around 30 %: above ~45 % the Internal Mic Boost clips.
## FrameworkComputer/SoftwareFirmwareIssueTracker#166, omacom/omarchy#15218.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.pci-*"
        device.product.name = "Ryzen HD Audio Controller"
      }
    ]
    actions = { update-props = { api.alsa.use-ucm = false } }
  }
  {
    # The internal microphone ahead of Bluetooth headsets (2010): the screen
    # recorder and most apps take the default input, and the privacy switch
    # only cuts this one. A headset mic stays selectable by hand.
    matches = [ { node.name = "~alsa_input.pci-.*analog-stereo" } ]
    actions = { update-props = { priority.session = 2100, priority.driver = 2100 } }
  }
]
