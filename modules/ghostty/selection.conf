# Terminal half of zsh-selection.
# performable: with no mouse selection, Ctrl+Insert goes through to zsh (copies its selection)
keybind = performable:control+insert=copy_to_clipboard
# Alt+C (passed through by Hyprland): copy the mouse selection, or let zsh copy its own
keybind = performable:alt+c=copy_to_clipboard
# Let zsh handle Shift/Ctrl+Shift + arrows/Home/End for text selection
keybind = shift+arrow_left=unbind
keybind = shift+arrow_right=unbind
keybind = shift+arrow_up=unbind
keybind = shift+arrow_down=unbind
keybind = shift+home=unbind
keybind = shift+end=unbind
keybind = ctrl+shift+arrow_left=unbind
keybind = ctrl+shift+arrow_right=unbind
