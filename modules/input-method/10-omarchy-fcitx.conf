# Overrides Omarchy's /usr/lib/environment.d/10-omarchy-fcitx.conf (same file
# name wins here). fcitx5 is disabled, so apps handle dead keys (^ ¨) and
# Compose sequences (~/.XCompose) themselves instead of waiting for it.
INPUT_METHOD=
XMODIFIERS=
SDL_IM_MODULE=
GTK_IM_MODULE=simple
QT_IM_MODULE=compose
