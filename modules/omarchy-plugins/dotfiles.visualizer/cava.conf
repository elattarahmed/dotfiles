# cava for the dotfiles.visualizer bar widget: 8 bars as numbers 0-7 on
# stdout, one frame per line. It listens to what plays (the default output's
# monitor), never to the microphone.
[general]
bars = 8
framerate = 30
sensitivity = 100
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
